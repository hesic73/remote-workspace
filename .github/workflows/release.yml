name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build static artifact and manifest
        run: scripts/build-release.sh x86_64-unknown-linux-musl dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/remote-workspace-server-linux-x86_64-musl
            dist/release-manifest.json
            dist/SHA256SUMS
