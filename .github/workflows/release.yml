name: release

on:
  push:
    tags: ["v*"]
  # Build-only dry run, so the artifacts can be verified before a tag exists.
  # Publishing is gated on the ref actually being a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        # The client links rustls, whose crypto backend ships C code, so a
        # static build needs a musl C compiler as well as the Rust target.
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Build static artifacts and manifest
        run: scripts/build-release.sh x86_64-unknown-linux-musl dist

      - name: Check artifacts run and self-report
        run: |
          set -e
          for b in remote-workspace remote-workspace-mcp; do
            dist/$b-linux-x86_64-musl --version
          done
          dist/remote-workspace-server-linux-x86_64-musl --version-json
          # Matches both "statically linked" and the "static-pie linked" that
          # current musl toolchains produce.
          for b in remote-workspace remote-workspace-server remote-workspace-mcp; do
            file "dist/$b-linux-x86_64-musl" | grep -q "static" \
              || { echo "$b is not statically linked"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist/*

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Test Windows client and MCP
        run: cargo test -p remote-workspace-client -p remote-workspace-mcp

      - name: Build Windows client and MCP artifacts
        run: scripts/build-release.sh x86_64-pc-windows-msvc dist

      - name: Check Windows artifacts run
        run: |
          dist/remote-workspace-windows-x86_64.exe --version
          dist/remote-workspace-mcp-windows-x86_64.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
